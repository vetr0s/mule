name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-13, gcc-14, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Install gcc 14
        if: matrix.cc == 'gcc-14'
        run: sudo apt-get update && sudo apt-get install -y gcc-14
      # ASan crashes at startup when the kernel randomises mmap with more bits.
      - name: Lower mmap randomisation for AddressSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: $CC --version
      - run: $CC -Isrc -o build build.c
      - run: ./build test
      # glibc's realloc can grow in place, which ASan's never does.
      - run: ./build test --no-sanitize --out=.build/nosan
      - run: ./build release
      - run: ./build examples
      - run: ./build data
      - run: .build/release/main data/pg2554.txt
      - name: Example project
        working-directory: examples/project
        run: $CC build.c && ./a.out run

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cc --version
      - run: cc -Isrc -o build build.c
      - run: ./build test
      # heap_growth_returns_memory needs the real libmalloc, not ASan's.
      - run: ./build test --no-sanitize --out=.build/nosan
      - run: ./build release
      - run: ./build examples
      - run: ./build data
      - run: .build/release/main data/pg2554.txt

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # docs/DoxygenLayout.xml comes from 1.18, and Ubuntu's 1.9.8 rejects it.
      - name: Install doxygen 1.18.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/doxygen.tar.gz" \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - run: doxygen --version
      - run: cc -Isrc -o build build.c
      - run: ./build docs
      - name: dist/mule.h matches src/
        run: ./build dist && git diff --exit-code dist/
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/docs/html

  # Publishes the reference to GitHub Pages once everything above passes.
  pages:
    if: github.event_name == 'push'
    needs: [linux, macos, docs]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
