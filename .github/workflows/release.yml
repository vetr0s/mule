name: Release

# Pushing a tag such as v0.0.1 publishes dist/mule.h as a GitHub release,
# with that version's section of CHANGELOG.md as the notes.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cc -Isrc -o build build.c
      - name: Tag matches MULE_VERSION in src/base/base.h
        run: test "v$(./build version)" = "$GITHUB_REF_NAME"
      # ASan crashes at startup when the kernel randomises mmap with more bits.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: ./build ci
      - name: Notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next }
            on && !/^\[[^]]*\]: /' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/mule.h --verify-tag \
            --title "MULE $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
